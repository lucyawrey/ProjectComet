# ShapeLand's interface text in English, by key: [join] then name_taken is join.name_taken. Placeholders are
# written {name}. The client looks text up by key (UXML labels hold "#key"; the web page's elements, data-text).

[join]
title = "ShapeLand"
name_label = "NAME"
name_hint = "A name must be 1-16 characters and can only include a-z, 0-9, -, _ and spaces."
