<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- On phones: Add to Home Screen opens the game without browser bars (the only full screen iPhone allows). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ShapeLand">
    <meta name="theme-color" content="#0e1117">
    <script>
      // A phone (a touch screen whose short side is phone-sized, not a tablet) gets the game filling the screen, in
      // landscape. "no-fullscreen": the browser can't make the page full screen (iPhone Safari); "standalone": it
      // was opened from the home screen.
      (function () {
        var root = document.documentElement;
        var phone = matchMedia("(pointer: coarse)").matches && navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) <= 600;
        root.classList.toggle("phone", phone);
        root.classList.toggle("no-fullscreen", !root.requestFullscreen);
        root.classList.toggle("standalone", navigator.standalone === true || matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
    <link rel="stylesheet" href="TemplateData/shapeland.css">
    <!-- Written by the deploy (tools/shapeland-testbuild.sh) when the game server isn't the page's own host; absent
         when the game server serves the page itself. -->
    <script src="config.js" onerror="void 0"></script>
  </head>
  <body data-state="checking">
    <main class="page-root">
      <div class="site">
        <header class="top">
          <div><span class="name" data-text="page.name"></span> <span class="sub" data-text="page.sub"></span></div>
          <span class="status" aria-live="polite"><span class="dot"></span>
            <span data-state="checking" data-text="page.checking"></span><span data-state="loading tap open" data-text="page.open"></span><span data-state="closed" data-text="page.closed"></span><span data-state="failed" data-text="page.failed"></span>
          </span>
        </header>

        <div class="frame">
          <canvas id="unity-canvas" tabindex="-1"></canvas>
          <div class="over" data-state="checking loading">
            <div class="card">
              <h2 data-text="page.loading_title"></h2>
              <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div>
              <p class="small" id="progress-text" data-text="page.checking"></p>
            </div>
          </div>
          <div class="over" data-state="closed">
            <div class="card">
              <h2 data-text="page.closed_title"></h2>
              <p data-text="page.closed_body"></p>
              <button class="btn" type="button" id="check" data-text="page.check_again"></button>
              <p class="small" id="checked" data-text="page.checked_now"></p>
            </div>
          </div>
          <div class="over tap" data-state="tap" id="tap">
            <div class="card">
              <h2 data-text="page.tap_title"></h2>
              <p data-text="page.tap_body"></p>
              <p class="small home-hint" data-text="page.home_screen"></p>
            </div>
          </div>
          <div class="over" data-state="failed">
            <div class="card">
              <h2 data-text="page.failed_title"></h2>
              <p id="failed-text" data-text="page.failed_body"></p>
            </div>
          </div>
        </div>

        <footer class="under">
          <button class="fs" type="button" id="fullscreen" data-label="page.fullscreen_label" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg><span data-text="page.fullscreen"></span></button>
        </footer>
      </div>
      <div class="rotate">
        <div class="card">
          <h2 data-text="page.rotate_title"></h2>
          <p data-text="page.rotate_body"></p>
          <p class="small home-hint" data-text="page.rotation_lock"></p>
        </div>
      </div>
      <!-- Measures the screen's safe area (notches, rounded corners) for the game's HUD (ShapeLandPage.jslib). -->
      <div id="safe-area"></div>
    </main>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      (function () {
        // The page's text (page.* in shapeland/content/strings/en.toml), put in by the build (Builds.Web). Elements
        // name theirs with data-text, their aria-label with data-label and their tooltip with data-title.
        var TEXT = /* PAGE_TEXT */ {};
        document.querySelectorAll("[data-text]").forEach(function (element) {
          element.textContent = TEXT[element.dataset.text];
        });
        document.querySelectorAll("[data-label]").forEach(function (element) {
          element.setAttribute("aria-label", TEXT[element.dataset.label]);
        });
        document.querySelectorAll("[data-title]").forEach(function (element) {
          element.title = TEXT[element.dataset.title];
        });

        // The game server to use (window.shapelandServer, from config.js), or the page's own host.
        var server = window.shapelandServer || "";
        var body = document.body;
        var root = document.documentElement;
        var phone = root.classList.contains("phone");
        var instance = null;

        function show(state) { body.dataset.state = state; }

        // Whether the game server is up: its /health answers "ok". Anything else (no answer, a timeout, or another
        // host answering for its name, like a wildcard DNS record) means it isn't.
        function serverUp() {
          if (!server) {
            return Promise.resolve(true); // the game server is serving this page
          }
          var http = server.replace(/^ws(s?):/, "http$1:").replace(/\/ws$/, "/health");
          var abort = new AbortController();
          var timer = setTimeout(function () { abort.abort(); }, 5000);
          return fetch(http, { cache: "no-store", signal: abort.signal })
            .then(function (response) { return response.ok ? response.text() : ""; })
            .then(function (text) { return text === "ok"; }, function () { return false; })
            .finally(function () { clearTimeout(timer); });
        }

        function start() {
          show("checking");
          serverUp().then(function (up) {
            if (!up) {
              show("closed");
              return;
            }
            show("loading");
            load();
          });
        }

        function load() {
          var bar = document.getElementById("progress");
          var text = document.getElementById("progress-text");
          createUnityInstance(document.querySelector("#unity-canvas"), {
            arguments: [],
            // Phones draw at most 1.5 pixels per CSS pixel: sharp enough, and far cheaper than 3.
            devicePixelRatio: phone ? Math.min(window.devicePixelRatio || 1, 1.5) : undefined,
            // An error the browser hides the details of ("Script error.": from another origin, or the browser's own
            // scripts such as content blockers, as iPhone Safari reports after Tap to play) isn't the game's: logged,
            // not shown in Unity's alert. Every other error still is.
            errorHandler: function (message) {
              if (String(message).trim().indexOf("Script error") === 0) {
                console.warn("Ignored a script error the browser hid the details of.");
                return true;
              }
              return false;
            },
#if PROGRESSIVE_ASSET_LOADING
            primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
            secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          }, function (progress) {
            var percent = Math.round(progress * 100);
            bar.style.width = percent + "%";
            bar.parentElement.setAttribute("aria-valuenow", String(percent));
            text.textContent = percent + "%";
          }).then(function (unityInstance) {
            instance = unityInstance;
            document.getElementById("fullscreen").disabled = false;
            if (phone && !root.classList.contains("standalone")) {
              show("tap");
            } else {
              play();
            }
          }).catch(function (message) {
            document.getElementById("failed-text").textContent = String(message);
            show("failed");
          });
        }

        document.getElementById("check").addEventListener("click", function () {
          var checked = document.getElementById("checked");
          checked.textContent = TEXT["page.checking_again"];
          serverUp().then(function (up) {
            if (up) {
              show("loading");
              load();
            } else {
              var time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
              checked.textContent = TEXT["page.checked_at"].replace("{time}", time);
            }
          });
        });

        document.getElementById("fullscreen").addEventListener("click", function () {
          if (instance) {
            instance.SetFullscreen(1);
          }
        });

        function play() {
          show("open");
          document.querySelector("#unity-canvas").focus();
        }

        // On a phone, the first tap makes the page full screen and turns it landscape where the browser allows it
        // (not iPhone Safari, whose card says to Add to Home Screen instead), then plays.
        document.getElementById("tap").addEventListener("click", function () {
          if (root.requestFullscreen && !document.fullscreenElement) {
            root.requestFullscreen({ navigationUI: "hide" }).then(function () {
              return screen.orientation && screen.orientation.lock ? screen.orientation.lock("landscape") : null;
            }).catch(function () {
              // Refused or unsupported: play in the browser as it is.
            });
          }
          play();
        });

        // Leaving full screen on a phone (the back gesture) brings the card back, to tap into it again.
        document.addEventListener("fullscreenchange", function () {
          if (phone && !document.fullscreenElement && body.dataset.state === "open") {
            show("tap");
          }
        });

        start();
      })();
    </script>
  </body>
</html>
