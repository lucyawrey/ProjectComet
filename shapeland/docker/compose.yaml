# ShapeLand under simulated network conditions. Start it with tools/run shapeland-dev --net PROFILE, which
# builds everything on the host and sets the variables below.
#
# netem sits on the game server's link, so every client gets the profile: the browser and desktop builds
# (through the published port) and the bots. The bots' own container can add more on top (BOTS_NETEM_*). The Login
# server has no netem: accounts aren't the netcode. Both servers reach PostgreSQL (tools/run comet-postgres) as
# comet-postgres on the comet network.
name: shapeland

networks:
  comet:
    external: true

services:
  login:
    image: shapeland-netem # built by the server service
    pull_policy: never
    user: ${SHAPELAND_USER:-0:0} # the host user, so the keys it makes in artifacts/keys stay readable outside Docker
    command:
      - dotnet
      - /app/bin/ShapeLand.LoginServer/debug/ShapeLand.LoginServer.dll
      - --urls
      - http://+:5090
      - --Login:ConnectionString=${SHAPELAND_DATABASE}
      - --Login:SigningKeyFile=/app/keys/login.pem
      - --Login:PublicKeysFolder=/app/keys/public
      - --Login:CreateSigningKey=true
      - --Login:AllowedOrigins:0=${SHAPELAND_PAGE:-http://localhost:5080}
      - --Login:AllowedOrigins:1=http://localhost:5080
      # The bots come from their container's address, which isn't known ahead: limits high enough for any run.
      - --Login:RateLimits:SignInPerMinute=100000
      - --Login:RateLimits:GuestsPerHour=100000
      - --Login:RateLimits:OtherPerMinute=100000
      - --ShapeLand:ContentFile=/app/content/content.bin
      - --ShapeLand:GameServer:Address=${SHAPELAND_GAME_ADDRESS:-ws://localhost:5080/ws}
    ports:
      - ${LOGIN_PUBLISH:-127.0.0.1:5090}:5090
    networks: [default, comet]
    volumes:
      - ../../artifacts/bin:/app/bin:ro
      - ../../artifacts/content/shapeland:/app/content:ro
      - ../../artifacts/keys:/app/keys
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5090"]
      interval: 1s
      retries: 60

  server:
    image: shapeland-netem
    build: . # just the runtime and tc; everything else is mounted
    entrypoint: /netem/netem.sh
    cap_add:
      - NET_ADMIN # for tc and the ifb device, inside this container's network namespace only
    environment:
      NETEM_DELAY: ${NETEM_DELAY:-0ms}
      NETEM_JITTER: ${NETEM_JITTER:-0ms}
      NETEM_LOSS: ${NETEM_LOSS:-0%}
    command:
      - dotnet
      - /app/bin/ShapeLand.GameServer/debug/ShapeLand.GameServer.dll
      - --urls
      - http://+:5080
      - --ShapeLand:ContentFile=/app/content/content.bin
      - --ShapeLand:WebRoot=${SHAPELAND_WEBROOT-/app/web} # empty for none
      - --ShapeLand:StartSpawn=${SHAPELAND_START_SPAWN-} # empty: each player where they left, or at their shape's spawn
      - --ShapeLand:ConnectionString=${SHAPELAND_DATABASE}
      - --ShapeLand:TicketKeysFolder=/app/keys/public
      - --ShapeLand:LoginUrl=${SHAPELAND_LOGIN_URL:-http://localhost:5090}
      - --Comet:Connections:MaxConnectionsPerAddress=1000 # the bots all come from one address
    ports:
      - ${SHAPELAND_PUBLISH:-127.0.0.1:5080}:5080
    networks: [default, comet]
    volumes:
      - ../../tools/docker:/netem:ro
      - ../../artifacts/bin:/app/bin:ro
      - ../../artifacts/content/shapeland:/app/content:ro
      - ../../artifacts/keys/public:/app/keys/public:ro
      - ${SHAPELAND_WEB_DIR:-../../artifacts/unity/shapeland/web}:/app/web:ro
    depends_on:
      login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5080"]
      interval: 1s
      retries: 30

  bots:
    image: shapeland-netem # built by the server service
    pull_policy: never
    profiles: [bots] # started only when there are bots
    entrypoint: /netem/netem.sh
    cap_add:
      - NET_ADMIN
    environment:
      NETEM_DELAY: ${BOTS_NETEM_DELAY:-0ms}
      NETEM_JITTER: ${BOTS_NETEM_JITTER:-0ms}
      NETEM_LOSS: ${BOTS_NETEM_LOSS:-0%}
    command:
      - dotnet
      - /app/bin/ShapeLand.Bots/debug/ShapeLand.Bots.dll
      - --login
      - http://login:5090
      - --server # the tickets name the address browsers use; the bots reach the server by its name here
      - ws://server:5080/ws
      - --tokens
      - /app/bot-tokens
      - --count
      - ${BOTS_COUNT:-0}
      - --cheaters
      - ${BOTS_CHEATERS:-0}
      - --content
      - /app/content/content.bin
      - --chat
      - ${BOTS_CHAT:-0} # average seconds between lines; 0 for quiet
    volumes:
      - ../../tools/docker:/netem:ro
      - ../../artifacts/bin:/app/bin:ro
      - ../../artifacts/content/shapeland:/app/content:ro
      - ../../artifacts/bot-tokens/net:/app/bot-tokens
    depends_on:
      server:
        condition: service_healthy
