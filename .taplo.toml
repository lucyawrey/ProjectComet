# Taplo (the engine behind VS Code's Even Better TOML) settings: content files get schemas generated by each game's
# content build (`dotnet run --project shapeland/src/ShapeLand.ContentBuild -- build`, or `schema`).

[[rule]]
include = ["shapeland/content/shapes/**/*.toml"]
schema = { path = "artifacts/content/shapeland/schemas/shape.schema.json" }
